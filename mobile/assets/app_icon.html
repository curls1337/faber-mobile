<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1024px;
      height: 1024px;
      background: linear-gradient(145deg, #0f172a 0%, #020617 65%, #1e1b4b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    .glow {
      position: absolute;
      width: 780px;
      height: 780px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(217, 119, 6, 0.08) 55%, transparent 75%);
      border-radius: 50%;
    }
    .badge {
      position: relative;
      width: 660px;
      height: 660px;
      border-radius: 170px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 45%, #d97706 100%);
      box-shadow: 0 40px 100px rgba(245, 158, 11, 0.45), inset 0 8px 24px rgba(255, 255, 255, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .letter {
      font-size: 430px;
      font-weight: 900;
      color: #090d16;
      letter-spacing: -18px;
      transform: translateY(-8px);
      text-shadow: 0 4px 12px rgba(255, 255, 255, 0.25);
    }
    .spark {
      position: absolute;
      top: 84px;
      right: 84px;
      width: 96px;
      height: 96px;
      background: #090d16;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }
    .spark-dot {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 24px #34d399;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="badge">
    <div class="letter">F</div>
    <div class="spark"><div class="spark-dot"></div></div>
  </div>
</body>
</html>
