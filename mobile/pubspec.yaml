name: faber_mobile
description: "Faber Studio iOS & Android Mobile Suite — Swarm, Code Studio, War Office & Media Vault"
publish_to: 'none'
version: 1.0.4+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_highlight: ^0.7.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon_1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon_1024.png
