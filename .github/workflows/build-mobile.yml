name: Build Mobile App (iOS IPA & Android APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Native Shells & Restore Custom Source
        working-directory: mobile
        run: |
          mkdir -p /tmp/custom_src
          cp -r lib /tmp/custom_src/
          cp pubspec.yaml /tmp/custom_src/
          flutter create --platforms=android,ios --org com.faberstudio.mobile --project-name faber_mobile .
          rm -rf lib/*
          cp -r /tmp/custom_src/lib/* lib/
          cp /tmp/custom_src/pubspec.yaml pubspec.yaml

          # Inject commercial App Display Name & INTERNET / MIC / BIOMETRIC / CAMERA permissions
          sed -i 's/android:label="[a-z_]*"/android:label="Faber Studio"/' android/app/src/main/AndroidManifest.xml || true
          for perm in INTERNET RECORD_AUDIO CAMERA USE_BIOMETRIC; do
            if ! grep -q "android.permission.$perm" android/app/src/main/AndroidManifest.xml; then
              sed -i "s|<application|<uses-permission android:name=\"android.permission.$perm\"/>\n    <application|" android/app/src/main/AndroidManifest.xml
            fi
          done

          # Configure compileSdkVersion & targetSdkVersion to 36 cleanly in build.gradle.kts / build.gradle
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
            sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle.kts || true
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle || true
          fi

          # Align subprojects compileSdkVersion to 36 to prevent checkReleaseAarMetadata failure on plugins
          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # Disable blocking release lint checks in Gradle
          if [ -f android/app/build.gradle.kts ]; then
            cat << 'EOF' >> android/app/build.gradle.kts

          android {
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF
          elif [ -f android/app/build.gradle ]; then
            cat << 'EOF' >> android/app/build.gradle

          android {
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF
          fi

          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK
        working-directory: mobile
        run: |
          flutter build apk --release || (cd android && ./gradlew assembleRelease -x lintVitalRelease)
          APK_PATH=$(find build/app/outputs -name "*release*.apk" | head -n 1)
          cp "$APK_PATH" ../FaberStudio-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ./FaberStudio-release.apk

  build-ios:
    name: Build iOS Sideload IPA (Flutter)
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Native Shells & Restore Custom Source
        working-directory: mobile
        run: |
          mkdir -p /tmp/custom_src
          cp -r lib /tmp/custom_src/
          cp pubspec.yaml /tmp/custom_src/
          flutter create --platforms=android,ios --org com.faberstudio.mobile --project-name faber_mobile .
          rm -rf lib/*
          cp -r /tmp/custom_src/lib/* lib/
          cp /tmp/custom_src/pubspec.yaml pubspec.yaml

          # Inject commercial App Display Name & iOS Microphone, Speech, Camera, Photos, FaceID permissions
          sed -i '' 's/<string>$(PRODUCT_NAME)<\/string>/<string>Faber Studio<\/string>/g' ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Faber Studio memerlukan mikrofon untuk dikte suara perintah AI.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Faber Studio memerlukan mikrofon untuk dikte suara perintah AI.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Faber Studio menggunakan pengenalan suara untuk mengetik instruksi agen secara hands-free.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'Faber Studio menggunakan pengenalan suara untuk mengetik instruksi agen secara hands-free.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Faber Studio membutuhkan akses galeri untuk melampirkan gambar ke agen AI.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Faber Studio membutuhkan akses galeri untuk melampirkan gambar ke agen AI.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Faber Studio membutuhkan kamera untuk memotret layar atau dokumen ke agen AI.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Faber Studio membutuhkan kamera untuk memotret layar atau dokumen ke agen AI.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Faber Studio menggunakan Face ID untuk menjaga keamanan akses ke server VPS Anda.'" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'Faber Studio menggunakan Face ID untuk menjaga keamanan akses ke server VPS Anda.'" ios/Runner/Info.plist
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Unsigned iOS App & Package IPA
        working-directory: mobile
        run: |
          flutter build ios --config-only --no-codesign
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            DEVELOPMENT_TEAM=""
          cd ..

          RUNNER_APP=$(find ios/build -name "Runner.app" -type d | head -n 1)
          if [ -z "$RUNNER_APP" ]; then
            echo "Runner.app not found!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$RUNNER_APP" Payload/
          zip -r ../FaberStudio-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ./FaberStudio-iOS.ipa

  publish-release:
    name: Publish IPA & APK to GitHub Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: ./release-files

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: iOS-IPA
          path: ./release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Faber Studio Mobile v1.0.0-${{ github.run_number }}"
          body: |
            ## Faber Studio Mobile — iOS & Android Release
            - **iOS Sideload (`.ipa`)**: `FaberStudio-iOS.ipa` (ESign, GBox, AltStore, Sideloadly)
            - **Android Direct Install (`.apk`)**: `FaberStudio-release.apk`
          draft: false
          prerelease: false
          files: |
            ./release-files/FaberStudio-release.apk
            ./release-files/FaberStudio-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
